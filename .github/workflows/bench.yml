name: Benchmark

# L5: v12n against Ontop on scaled MDR data (bench/run.sh). Manual only
# for now; it never runs on pull requests or pushes, so it cannot block
# one. Results are uploaded as an artifact to compare with bench/RESULTS.md.
on:
  workflow_dispatch:
    inputs:
      alerts:
        description: "Alerts to generate (100000 or 1000000)"
        default: "100000"
        type: choice
        options: ["100000", "1000000"]
      runs:
        description: "Timed runs per query and engine"
        default: "20"
        type: string

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: testenv/jdbc
          key: jdbc-${{ hashFiles('testenv/fetch-jdbc.sh') }}
      - run: testenv/fetch-jdbc.sh
      # A separate step, so the log shows pull time apart from the benchmark.
      - name: Pull pinned images
        run: |
          grep -oE '"(postgres|ontop/ontop):[^"]+"' bench/run.sh | tr -d '"' |
            xargs -n1 -P2 docker pull -q
      - run: bench/run.sh
        env:
          BENCH_ALERTS: ${{ inputs.alerts }}
          BENCH_RUNS: ${{ inputs.runs }}
          BENCH_OUT: ${{ github.workspace }}/bench/results/ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-${{ inputs.alerts }}
          path: bench/results/ci/
          if-no-files-found: warn
