name: Fuzz

# The cargo-fuzz targets of fuzz/ (#206), seeded with the queries and
# mappings of the test cases. A crash, a timeout or an out-of-memory input
# fails the job and is uploaded as an artifact. Fuzzing needs time to find
# anything, so the weekly run gives each target ten minutes; pull requests
# that change fuzz/ only check for one minute that the targets build and
# run.
on:
  pull_request:
    paths:
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"
  schedule:
    # Mondays 04:00 KST, after the differential run.
    - cron: "0 19 * * 0"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds per target"
        default: "600"

concurrency:
  group: fuzz-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [query_parse, mapping_parse, query_plan]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # cargo-fuzz builds with -Z flags, which need a nightly toolchain.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
          key: ${{ matrix.target }}
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-fuzz
      - run: fuzz/seed.sh
      - name: Fuzz ${{ matrix.target }}
        env:
          TARGET: ${{ matrix.target }}
          SECONDS_PER_TARGET: ${{ github.event_name == 'pull_request' && '60' || inputs.seconds || '600' }}
        run: |
          case "$SECONDS_PER_TARGET" in
            ''|*[!0-9]*) echo "seconds must be a number: $SECONDS_PER_TARGET"; exit 1 ;;
          esac
          # cargo-fuzz defaults to the target it was built for, which for the
          # prebuilt binary is musl; the runner's toolchain is for its host.
          host=$(rustc +nightly -vV | sed -n 's/^host: //p')
          cargo +nightly fuzz run --target "$host" "$TARGET" -- -max_total_time="$SECONDS_PER_TARGET"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
