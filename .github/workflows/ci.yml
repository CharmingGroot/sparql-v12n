name: CI

# Documentation-only pull requests still run every job. A paths-ignore filter
# here would skip the whole workflow, including pr-conventions and dco.
on:
  pull_request:
  push:
    branches: [main]

# A new commit on a pull request cancels the run for the previous one.
# Runs on main are queued, never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Keep tool-specific agent guidance out of the repository
        run: |
          if git ls-files | grep -E '(^|/)(AGENTS|CLAUDE|GEMINI)\.md$|(^|/)\.cursorrules$|(^|/)\.(claude|codex|cursor)/|^(worklog|plan|notes)/|^\.github/(copilot-instructions\.md$|instructions/|agents/)'; then
            echo '::error::Tool-specific agent guidance must stay local.'
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Only main saves the cache, so pull requests do not evict each other.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      # --no-tests=pass: the workspace has no tests yet.
      - run: cargo nextest run --workspace --locked --profile ci --no-tests=pass
      # nextest does not run doctests.
      - run: cargo test --workspace --doc --locked
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: junit
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn

  # L3: tests that need PostgreSQL run against a service container with
  # the shop example loaded. They skip themselves in the test job above.
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Same image as testenv/difftest.sh, pinned by digest.
        image: postgres:17.11@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
        env:
          POSTGRES_USER: v12n
          POSTGRES_PASSWORD: v12n-dev
          POSTGRES_DB: shop
        ports:
          - 127.0.0.1:55432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U v12n -d shop"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      V12N_TEST_DATABASE_URL: postgresql://v12n:v12n-dev@127.0.0.1:55432/shop
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Load the shop example
        env:
          CONTAINER: ${{ job.services.postgres.id }}
        run: cat examples/shop/schema.sql examples/shop/data.sql | docker exec -i "$CONTAINER" psql -q -v ON_ERROR_STOP=1 -U v12n -d shop
      # Integration test binaries only; the differential tests have their
      # own workflow.
      - run: cargo nextest run --workspace --locked --profile ci -E 'kind(test) - package(v12n-difftest)'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: junit-postgres
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --workspace --all-targets --locked

  # PR title becomes the squash commit, so it must follow the commit convention.
  pr-conventions:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check PR title and linked issue
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          fail=0
          types='feat|fix|perf|refactor|test|docs|build|ci|chore|revert'
          scopes='core|postgres|server|cli|mapping|sparql|unfold|optimize|sql|deps|release'
          if ! printf '%s' "$TITLE" | grep -qE "^($types)(\(($scopes)\))?!?: [a-z0-9\`].*[^.]$"; then
            echo "::error::PR title must be '<type>(<scope>): <subject>' (got: $TITLE)"; fail=1
          fi
          if [ "${#TITLE}" -gt 72 ]; then echo "::error::PR title is longer than 72 characters"; fail=1; fi
          if printf '%s' "$TITLE" | grep -qP '[\p{Hangul}\p{Han}\p{Hiragana}\p{Katakana}]'; then
            echo "::error::PR title must be in English (it becomes the commit title)"; fail=1
          fi
          case "$HEAD_REF" in dependabot/*) exit $fail ;; esac
          if ! printf '%s' "$BODY" | grep -qiE '(closes|fixes|resolves|refs) #[0-9]+'; then
            echo "::error::PR body must link an issue (Closes #N or Refs #N)"; fail=1
          fi
          if ! printf '%s' "$HEAD_REF" | grep -qE "^($types)/[0-9]+-[a-z0-9-]+$"; then
            echo "::error::Branch must be '<type>/<issue>-<short-name>' (got: $HEAD_REF)"; fail=1
          fi
          exit $fail

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check Signed-off-by
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list "$BASE..$HEAD"); do
            author=$(git log -1 --format='%an <%ae>' "$c")
            case "$author" in *"[bot]"*) continue ;; esac
            if ! git log -1 --format=%B "$c" | grep -qF "Signed-off-by: $author"; then
              echo "::error::commit $c is not signed off by $author (git commit -s)"
              missing=1
            fi
          done
          exit $missing

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
