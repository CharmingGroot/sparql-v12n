name: CI

# Pull requests: `checks` always runs; `lint` and `test` run unless the
# pull request changes documentation only. A paths-ignore filter would skip
# the whole workflow, including the pull request checks.
# Push to main: only `test`, the one thing a squash merge can change. It also
# saves the shared Rust cache that every other job restores.
on:
  pull_request:
  push:
    branches: [main]

# A new commit on a pull request cancels the run for the previous one.
# Runs on main are queued, never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The Rust cache key hashes CARGO_* variables, so differential.yml must set
# the same ones to share the cache.
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

permissions:
  contents: read

jobs:
  # Cheap pull request checks that need no Rust toolchain.
  checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.paths.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # First, so the output is set even when a later check fails. Anything
      # but Markdown, docs/, LICENSE and NOTICE counts as code; if the diff
      # cannot be read, everything runs.
      - name: Detect code changes
        id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          docs='\.md$|^docs/|^(LICENSE|NOTICE)$'
          if changed=$(git diff --name-only "$BASE...$HEAD") && ! printf '%s\n' "$changed" | grep -qvE "$docs"; then
            code=false
          else
            code=true
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code changed: $code"
      - name: Keep tool-specific agent guidance out of the repository
        if: ${{ !cancelled() }}
        run: |
          if git ls-files | grep -E '(^|/)(AGENTS|CLAUDE|GEMINI)\.md$|(^|/)\.cursorrules$|(^|/)\.(claude|codex|cursor)/|^(worklog|plan|notes)/|^\.github/(copilot-instructions\.md$|instructions/|agents/)'; then
            echo '::error::Tool-specific agent guidance must stay local.'
            exit 1
          fi
      # PR title becomes the squash commit, so it must follow the commit convention.
      - name: Check PR title and linked issue
        if: ${{ !cancelled() }}
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          fail=0
          types='feat|fix|perf|refactor|test|docs|build|ci|chore|revert'
          scopes='core|postgres|server|cli|mapping|sparql|unfold|optimize|sql|deps|release'
          if ! printf '%s' "$TITLE" | grep -qE "^($types)(\(($scopes)\))?!?: [a-z0-9\`].*[^.]$"; then
            echo "::error::PR title must be '<type>(<scope>): <subject>' (got: $TITLE)"; fail=1
          fi
          if [ "${#TITLE}" -gt 72 ]; then echo "::error::PR title is longer than 72 characters"; fail=1; fi
          if printf '%s' "$TITLE" | grep -qP '[\p{Hangul}\p{Han}\p{Hiragana}\p{Katakana}]'; then
            echo "::error::PR title must be in English (it becomes the commit title)"; fail=1
          fi
          case "$HEAD_REF" in dependabot/*) exit $fail ;; esac
          if ! printf '%s' "$BODY" | grep -qiE '(closes|fixes|resolves|refs) #[0-9]+'; then
            echo "::error::PR body must link an issue (Closes #N or Refs #N)"; fail=1
          fi
          if ! printf '%s' "$HEAD_REF" | grep -qE "^($types)/[0-9]+-[a-z0-9-]+$"; then
            echo "::error::Branch must be '<type>/<issue>-<short-name>' (got: $HEAD_REF)"; fail=1
          fi
          exit $fail
      - name: Check Signed-off-by
        if: ${{ !cancelled() }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          # Merge commits from GitHub's "Update branch" carry no sign-off and
          # are dropped by the squash merge, so only authored commits count.
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author=$(git log -1 --format='%an <%ae>' "$c")
            case "$author" in *"[bot]"*) continue ;; esac
            if ! git log -1 --format=%B "$c" | grep -qF "Signed-off-by: $author"; then
              echo "::error::commit $c is not signed off by $author (git commit -s)"
              missing=1
            fi
          done
          exit $missing

  # L1: format, lints, dependency policy and the minimum supported Rust
  # version. Pull requests only: main receives nothing that skipped them.
  lint:
    needs: checks
    if: ${{ !cancelled() && needs.checks.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: v12n
          save-if: false
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The cache key hashes every installed toolchain, so the MSRV
      # toolchain is installed only after the cache is restored.
      - name: MSRV
        run: |
          rustup toolchain install 1.88 --profile minimal --no-self-update
          cargo +1.88 check --workspace --all-targets --locked
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny --all-features check

  # L2 + L3: unit, snapshot and doc tests, then the tests that need
  # PostgreSQL, from one build.
  test:
    needs: checks
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.checks.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    # 20, not 15: a main run that misses the cache builds for every job.
    timeout-minutes: 20
    services:
      postgres:
        # Same image as testenv/difftest.sh, pinned by digest.
        image: postgres:17.11@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
        env:
          POSTGRES_USER: v12n
          POSTGRES_PASSWORD: v12n-dev
          POSTGRES_DB: shop
        ports:
          - 127.0.0.1:55432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U v12n -d shop"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # The one cache every job and workflow restores; only main saves it,
      # so pull requests do not evict each other.
      - uses: Swatinem/rust-cache@v2
        id: cache
        with:
          shared-key: v12n
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      # Without V12N_TEST_DATABASE_URL the database tests skip themselves.
      - run: cargo nextest run --workspace --locked --profile ci --no-tests=pass
      - name: Keep the unit test report
        if: always()
        run: if [ -f target/nextest/ci/junit.xml ]; then mv target/nextest/ci/junit.xml target/nextest/ci/junit-unit.xml; fi
      # nextest does not run doctests.
      - run: cargo test --workspace --doc --locked
      # The PostgreSQL tests report on their own even when a test above fails.
      - name: Load the shop example
        if: ${{ !cancelled() }}
        env:
          CONTAINER: ${{ job.services.postgres.id }}
        run: cat examples/shop/schema.sql examples/shop/data.sql | docker exec -i "$CONTAINER" psql -q -v ON_ERROR_STOP=1 -U v12n -d shop
      # Integration test binaries against PostgreSQL, plus the v12n-postgres
      # library, whose unit tests include one that reads a query plan from
      # PostgreSQL; reuses the build above. The differential tests have
      # their own workflow.
      - name: PostgreSQL tests
        if: ${{ !cancelled() }}
        env:
          V12N_TEST_DATABASE_URL: postgresql://v12n:v12n-dev@127.0.0.1:55432/shop
        run: cargo nextest run --workspace --locked --profile ci -E '(kind(test) - package(v12n-difftest)) + (kind(lib) & package(v12n-postgres))'
      - name: Keep the PostgreSQL test report
        if: always()
        run: if [ -f target/nextest/ci/junit.xml ]; then mv target/nextest/ci/junit.xml target/nextest/ci/junit-postgres.xml; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: junit
          path: target/nextest/ci/junit-*.xml
          if-no-files-found: warn
      # When main is about to save a new cache, put the builds of the other
      # jobs into it too: clippy reuses `cargo check` dependencies, the MSRV
      # check needs its own toolchain, and the differential tests build
      # v12n-difftest alone, which unifies features differently. The cache
      # is not saved on an exact hit, so this runs only after a miss.
      - name: Warm the shared cache for lint, MSRV and differential
        if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        run: |
          cargo check --workspace --all-targets --locked
          rustup toolchain install 1.88 --profile minimal --no-self-update
          cargo +1.88 check --workspace --all-targets --locked
          cargo nextest run -p v12n-difftest --locked --no-run
