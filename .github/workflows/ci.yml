name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Keep tool-specific agent guidance out of the repository
        run: |
          if git ls-files | grep -E '(^|/)(AGENTS|CLAUDE|GEMINI)\.md$|(^|/)\.cursorrules$|(^|/)\.(claude|codex|cursor)/|^(worklog|plan|notes)/|^\.github/(copilot-instructions\.md$|instructions/|agents/)'; then
            echo '::error::Tool-specific agent guidance must stay local.'
            exit 1
          fi
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  # PR title becomes the squash commit, so it must follow the commit convention.
  pr-conventions:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title and linked issue
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          fail=0
          types='feat|fix|perf|refactor|test|docs|build|ci|chore|revert'
          scopes='core|postgres|server|cli|mapping|sparql|unfold|optimize|sql|deps|release'
          if ! printf '%s' "$TITLE" | grep -qE "^($types)(\(($scopes)\))?!?: [a-z0-9\`].*[^.]$"; then
            echo "::error::PR title must be '<type>(<scope>): <subject>' (got: $TITLE)"; fail=1
          fi
          if [ "${#TITLE}" -gt 72 ]; then echo "::error::PR title is longer than 72 characters"; fail=1; fi
          if printf '%s' "$TITLE" | grep -qP '[\p{Hangul}\p{Han}\p{Hiragana}\p{Katakana}]'; then
            echo "::error::PR title must be in English (it becomes the commit title)"; fail=1
          fi
          case "$HEAD_REF" in dependabot/*) exit $fail ;; esac
          if ! printf '%s' "$BODY" | grep -qiE '(closes|fixes|resolves|refs) #[0-9]+'; then
            echo "::error::PR body must link an issue (Closes #N or Refs #N)"; fail=1
          fi
          if ! printf '%s' "$HEAD_REF" | grep -qE "^($types)/[0-9]+-[a-z0-9-]+$"; then
            echo "::error::Branch must be '<type>/<issue>-<short-name>' (got: $HEAD_REF)"; fail=1
          fi
          exit $fail

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check Signed-off-by
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list "$BASE..$HEAD"); do
            author=$(git log -1 --format='%an <%ae>' "$c")
            case "$author" in *"[bot]"*) continue ;; esac
            if ! git log -1 --format=%B "$c" | grep -qF "Signed-off-by: $author"; then
              echo "::error::commit $c is not signed off by $author (git commit -s)"
              missing=1
            fi
          done
          exit $missing

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
