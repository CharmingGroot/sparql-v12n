name: Differential

# L4: the same queries through this engine and Ontop (testenv/difftest.sh).
# Pull requests run it only when they change what produces or checks the
# results; the weekly run covers everything else.
on:
  pull_request:
    paths:
      - "crates/v12n-core/**"
      - "crates/v12n-postgres/**"
      - "crates/v12n-difftest/**"
      - "examples/**"
      - "tests/diff/**"
      - "tests/w3c/**"
      - "testenv/difftest.sh"
      - "testenv/fetch-jdbc.sh"
      - "Cargo.lock"
      - ".config/nextest.toml"
      - ".github/workflows/differential.yml"
  schedule:
    # Mondays 03:00 KST.
    - cron: "0 18 * * 0"
  workflow_dispatch:

concurrency:
  group: differential-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Same CARGO_* variables as ci.yml, so the Rust cache key matches.
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

permissions:
  contents: read

jobs:
  ontop:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # One job compiles the tests once and runs every case in batches of
    # DIFF_BATCH Ontop containers, one JVM per case.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      # Restores the cache that CI saves on main, which already holds the
      # v12n-difftest build; this workflow never saves it.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: v12n
          save-if: false
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: nextest
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: testenv/jdbc
          key: jdbc-${{ hashFiles('testenv/fetch-jdbc.sh') }}
      # Checks the checksum of a cached driver too.
      - run: testenv/fetch-jdbc.sh
      # A separate step, so the log shows pull time apart from the tests.
      - name: Pull pinned images
        run: |
          grep -oE '"(postgres|ontop/ontop):[^"]+"' testenv/difftest.sh | tr -d '"' |
            xargs -n1 -P2 docker pull -q
      - run: testenv/difftest.sh
        env:
          DIFF_NEXTEST_PROFILE: ci
          DIFF_BATCH: 10
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: junit-differential
          path: target/nextest/ci/junit-*.xml
          if-no-files-found: warn
