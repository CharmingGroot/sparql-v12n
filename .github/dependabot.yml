version: 2
# Every update pull request runs CI and, for Cargo.lock, the differential
# tests, so updates come in a few grouped pull requests. Security updates
# are not limited by this schedule.
#
# The pull request title becomes the squash commit, so it must pass the
# pr-conventions check in ci.yml: the "build(deps)" prefix gives titles such
# as "build(deps): bump the minor group across 1 directory with 5 updates".
# Group names stay short to keep such titles within 72 characters.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "build(deps)"
    groups:
      # Minor and patch updates.
      minor:
        update-types: [minor, patch]
      major:
        update-types: [major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: quarterly
    open-pull-requests-limit: 1
    commit-message:
      prefix: "build(deps)"
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # The MSRV check pins the minimum supported Rust version on purpose.
      - dependency-name: dtolnay/rust-toolchain
