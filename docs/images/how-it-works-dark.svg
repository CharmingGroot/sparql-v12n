<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" width="960" height="590" role="img" aria-labelledby="overview-dark-title overview-dark-desc"><title id="overview-dark-title">SPARQL query planning and streamed result delivery</title><desc id="overview-dark-desc">A caller submits SPARQL. Within v12n, a parsed R2RML mapping guides query planning and RDF-term construction. Database keys and column types inform SQL generation as needed. PostgreSQL executes one result-retrieval SQL query, returns rows, and v12n decodes them, constructs RDF terms and streams SELECT bindings as JSON, XML, CSV or TSV. Source data remains in PostgreSQL. Additional metadata and preparation exchanges may occur.</desc><defs><marker id="overview-dark-request" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#79c0ff"/></marker><marker id="overview-dark-response" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#56d4b6"/></marker><marker id="overview-dark-mapping" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a4afbb"/></marker></defs><rect width="960" height="590" rx="12" fill="#0d1117"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"><rect x="185" y="30" width="540" height="510" rx="14" fill="#151b23" stroke="#45515f" stroke-width="1.5"/><text x="211" y="62" text-anchor="start" font-size="23" font-weight="700" fill="#e6edf3">v12n</text><text x="701" y="61" text-anchor="end" font-size="16" font-weight="400" fill="#a4afbb">CLI / HTTP endpoint</text><rect x="18" y="165" width="130" height="205" rx="10" fill="#0d1117" stroke="#45515f" stroke-width="1.5"/><text x="83.0" y="195" text-anchor="middle" font-size="19" font-weight="600" fill="#e6edf3">Caller</text><text x="83.0" y="221" text-anchor="middle" font-size="16" font-weight="400" fill="#a4afbb">Terminal or</text><text x="83.0" y="244" text-anchor="middle" font-size="16" font-weight="400" fill="#a4afbb">HTTP client</text><rect x="800" y="165" width="142" height="205" rx="10" fill="#0d1117" stroke="#45515f" stroke-width="1.5"/><text x="871.0" y="195" text-anchor="middle" font-size="19" font-weight="600" fill="#e6edf3">PostgreSQL</text><text x="871.0" y="221" text-anchor="middle" font-size="16" font-weight="400" fill="#a4afbb">Source tables</text><text x="871.0" y="244" text-anchor="middle" font-size="16" font-weight="400" fill="#a4afbb">stay here</text><text x="211" y="98" text-anchor="start" font-size="14" font-weight="700" fill="#79c0ff">QUERY →</text><text x="211" y="389" text-anchor="start" font-size="14" font-weight="700" fill="#56d4b6">← RESULTS</text><rect x="210" y="116" width="220" height="108" rx="10" fill="#0d1117" stroke="#79c0ff" stroke-width="1.5"/><text x="320.0" y="146" text-anchor="middle" font-size="19" font-weight="600" fill="#e6edf3">1  Plan the query</text><text x="320.0" y="172" text-anchor="middle" font-size="16" font-weight="400" fill="#a4afbb">Parse SPARQL</text><text x="320.0" y="195" text-anchor="middle" font-size="16" font-weight="400" fill="#a4afbb">Unfold through mapping</text><rect x="480" y="116" width="220" height="108" rx="10" fill="#0d1117" stroke="#79c0ff" stroke-width="1.5"/><text x="590.0" y="146" text-anchor="middle" font-size="19" font-weight="600" fill="#e6edf3">2  Generate SQL</text><text x="590.0" y="172" text-anchor="middle" font-size="16" font-weight="400" fill="#a4afbb">Optimize with DB metadata</text><text x="590.0" y="195" text-anchor="middle" font-size="16" font-weight="400" fill="#a4afbb">Render SQL + parameters</text><rect x="480" y="408" width="220" height="108" rx="10" fill="#0d1117" stroke="#56d4b6" stroke-width="1.5"/><text x="590.0" y="438" text-anchor="middle" font-size="19" font-weight="600" fill="#e6edf3">3  Build RDF terms</text><text x="590.0" y="464" text-anchor="middle" font-size="16" font-weight="400" fill="#a4afbb">Decode rows</text><text x="590.0" y="487" text-anchor="middle" font-size="16" font-weight="400" fill="#a4afbb">Apply term maps</text><rect x="210" y="408" width="220" height="108" rx="10" fill="#0d1117" stroke="#56d4b6" stroke-width="1.5"/><text x="320.0" y="438" text-anchor="middle" font-size="19" font-weight="600" fill="#e6edf3">4  Stream bindings</text><text x="320.0" y="464" text-anchor="middle" font-size="16" font-weight="400" fill="#a4afbb">Serialize SELECT results</text><text x="320.0" y="487" text-anchor="middle" font-size="16" font-weight="400" fill="#a4afbb">JSON · XML · CSV · TSV</text><rect x="260" y="272" width="390" height="83" rx="10" fill="#0d1117" stroke="#45515f" stroke-width="1.5"/><text x="455.0" y="302" text-anchor="middle" font-size="19" font-weight="600" fill="#e6edf3">Parsed R2RML mapping</text><text x="455.0" y="328" text-anchor="middle" font-size="16" font-weight="400" fill="#a4afbb">Tables, columns, term maps &amp; datatypes</text><path d="M148 194 L178 194 L178 170 L210 170" fill="none" stroke="#79c0ff" stroke-width="2" marker-end="url(#overview-dark-request)"/><text x="150" y="152" text-anchor="middle" font-size="15" font-weight="400" fill="#79c0ff">SPARQL</text><path d="M430 170 L480 170" fill="none" stroke="#79c0ff" stroke-width="2" marker-end="url(#overview-dark-request)"/><path d="M700 142 L767 142 L767 187 L800 187" fill="none" stroke="#a4afbb" stroke-width="2" marker-end="url(#overview-dark-mapping)" marker-start="url(#overview-dark-mapping)" stroke-dasharray="5 5"/><text x="755" y="125" text-anchor="middle" font-size="15" font-weight="400" fill="#a4afbb">metadata¹</text><path d="M700 198 L800 198" fill="none" stroke="#79c0ff" stroke-width="2" marker-end="url(#overview-dark-request)"/><text x="753" y="224" text-anchor="middle" font-size="15" font-weight="400" fill="#79c0ff">result SQL</text><path d="M800 338 L760 338 L760 462 L700 462" fill="none" stroke="#56d4b6" stroke-width="2" marker-end="url(#overview-dark-response)"/><text x="782" y="397" text-anchor="middle" font-size="15" font-weight="400" fill="#56d4b6">rows</text><path d="M480 462 L430 462" fill="none" stroke="#56d4b6" stroke-width="2" marker-end="url(#overview-dark-response)"/><path d="M210 462 L172 462 L172 338 L148 338" fill="none" stroke="#56d4b6" stroke-width="2" marker-end="url(#overview-dark-response)"/><text x="145" y="397" text-anchor="middle" font-size="15" font-weight="400" fill="#56d4b6">bindings</text><path d="M320 272 L320 224" fill="none" stroke="#a4afbb" stroke-width="2" marker-end="url(#overview-dark-mapping)" stroke-dasharray="5 5"/><text x="331" y="253" text-anchor="start" font-size="15" font-weight="400" fill="#a4afbb">planning rules</text><path d="M590 355 L590 408" fill="none" stroke="#a4afbb" stroke-width="2" marker-end="url(#overview-dark-mapping)" stroke-dasharray="5 5"/><text x="578" y="382" text-anchor="end" font-size="15" font-weight="400" fill="#a4afbb">term definitions</text><text x="28" y="570" text-anchor="start" font-size="16" font-weight="400" fill="#a4afbb">¹ Metadata and statement preparation may add DB exchanges; one SQL retrieves the query results.</text></g></svg>