<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" role="img" aria-label="A SPARQL query and an R2RML mapping go into v12n, which translates the query into one SQL query and sends it to PostgreSQL, where the data stays. PostgreSQL returns rows, and v12n turns them into SPARQL results in JSON or CSV."><title>A SPARQL query and an R2RML mapping go into v12n, which translates the query into one SQL query and sends it to PostgreSQL, where the data stays. PostgreSQL returns rows, and v12n turns them into SPARQL results in JSON or CSV.</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#59636e"/></marker></defs><rect x="20" y="40" width="190" height="64" rx="8" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.2"/><text x="115.0" y="68.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328">SPARQL query</text><text x="115.0" y="87.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#59636e">SELECT ...</text><rect x="20" y="136" width="190" height="64" rx="8" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.2"/><text x="115.0" y="164.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328">R2RML mapping</text><text x="115.0" y="183.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#59636e">tables → classes, properties</text><rect x="300" y="78" width="200" height="84" rx="8" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.6"/><text x="400.0" y="116.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#bc4c00">v12n</text><text x="400.0" y="135.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#59636e">translates SPARQL to SQL</text><rect x="610" y="78" width="190" height="84" rx="8" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.2"/><text x="705.0" y="116.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328">PostgreSQL</text><text x="705.0" y="135.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#59636e">the data stays here</text><rect x="300" y="216" width="200" height="64" rx="8" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.2"/><text x="400.0" y="244.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328">SPARQL results</text><text x="400.0" y="263.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#59636e">JSON, CSV</text><path d="M210 72 L250 72 L250 110 L300 110" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#a)"/><path d="M210 168 L250 168 L250 130 L300 130" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#a)"/><path d="M500 106 L610 106" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#a)"/><text x="555" y="98" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#59636e">one SQL query</text><path d="M610 136 L500 136" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#a)"/><text x="555" y="154" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#59636e">rows</text><path d="M400 162 L400 216" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#a)"/></svg>
