# Functions on strings whose value is a string as the value of BIND: a
# computed variable holds only numbers (#100).
[query.bind-ucase]
expect = "rejected"

[query.bind-strafter]
expect = "rejected"

# REPLACE with alternatives: XPath takes the first alternative that
# matches, PostgreSQL the longest match (F&O 3.1 §5.6.4).
[query.replace-alternatives]
expect = "rejected"

# Ontop passes the replacement string to regexp_replace as it is, so "$2$1"
# stays literal ("$2$1ple"); XPath makes $N a group ("paple").
[query.replace-groups]
expect = "mismatch"
issue = 26

# A pattern that matches the empty string is an error (err:FORX0003, F&O
# 3.1 §5.6.4), so neither the comparison nor its negation holds. Ontop
# replaces the empty matches ("-a-p-p-l-e-") and keeps every word.
[query.replace-empty-match]
expect = "mismatch"
issue = 26

# STRLEN in ORDER BY comes with the other expressions there (#108).
[query.order-by-strlen]
expect = "rejected"

# A starting location that is not an xsd:integer: a type error by the
# signature of SUBSTR (SPARQL 1.1 §17.4.3.3), which engines that round it
# as fn:substring does answer.
[query.substr-decimal]
expect = "rejected"

# Ontop maps case with UPPER and LOWER under the database collation, which
# maps one character at a time: "Straße" to "STRAßE" and "ΟΔΟΣ" to "οδοσ".
# XPath uses the full case mappings of Unicode (F&O 3.1 §5.4.7, §5.4.8):
# "STRASSE" and "οδος".
[query.ucase-sharp-s]
expect = "mismatch"
issue = 26

[query.lcase-final-sigma]
expect = "mismatch"
issue = 26

# Ontop refuses LANG of a function result ("A variable or a value is
# expected in Lang").
[query.lcase-lang-language]
expect = "ontop-error"
issue = 26
solutions = 8
