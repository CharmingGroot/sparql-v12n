[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/CharmingGroot/sparql-v12n"
keywords = ["sparql", "r2rml", "obda", "knowledge-graph", "postgresql"]
categories = ["database", "command-line-utilities"]
publish = false

[workspace.dependencies]
v12n-core = { path = "crates/v12n-core" }
v12n-postgres = { path = "crates/v12n-postgres" }
v12n-server = { path = "crates/v12n-server" }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
bytes = "1.10"
clap = { version = "4.6", features = ["derive", "env"] }
form_urlencoded = "1.2"
futures-util = { version = "0.3.31", default-features = false }
oxrdf = "0.3.5"
oxttl = "0.2.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
spargebra = "0.4.8"
thiserror = "2.0"
tokio = { version = "1.47", default-features = false }
tokio-postgres = "0.7.18"
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }
tower = { version = "0.5.3", default-features = false }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
insta = { version = "1.49", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
